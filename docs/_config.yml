title: 바이브 코딩 스터디
description: 하네스 엔지니어링과 루프 엔지니어링으로 배우는 AI 코딩 에이전트 실무
remote_theme: just-the-docs/just-the-docs
lang: ko

url: https://Hyeokjinoh.github.io
baseurl: /vibecoding-study

# 다크 우선 커스텀 색상 (_sass/color_schemes/vibe.scss)
color_scheme: vibe

search_enabled: true
search:
  heading_level: 2
  previews: 3
  tokenizer_separator: /[\s/]+/
  button: false

heading_anchor: true
back_to_top: true
back_to_top_text: "↑ 맨 위로"

# 다이어그램 렌더링 — 이게 없으면 ```mermaid 블록이 코드로만 보인다.
# 세부 설정은 여기가 아니라 _includes/mermaid_config.js 에서 읽는다.
# (테마가 그 include 를 `var config = {...}` 로 주입한다)
mermaid:
  version: "10.9.1"

callouts_level: quiet
callouts:
  경고:
    title: 주의
    color: yellow
  견해:
    title: 필자 견해
    color: purple
  핵심:
    title: 핵심
    color: green

aux_links:
  "GitHub":
    - https://github.com/Hyeokjinoh/vibecoding-study
aux_links_new_tab: true

footer_content: >-
  문서 <a href="https://creativecommons.org/licenses/by/4.0/deed.ko">CC BY 4.0</a> ·
  코드 MIT ·
  <a href="https://github.com/Hyeokjinoh/vibecoding-study/blob/main/SOURCES.md">출처와 라이선스 고지</a><br>
  Anthropic PBC 와 제휴 관계가 없는 비공식 학습 자료입니다.

exclude:
  - _facts/

plugins:
  - jekyll-remote-theme
